[package]
name = "lmp_demo"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1"
eva-common = { version = "0.3", features = ["events", "common-payloads", "payload", "acl"] }
eva-sdk = { version = "0.3", features = ["controller"] }
log = "0.4"
mimalloc = "0.1"
once_cell = "1.20"
serde = { version = "1.0", features = ["derive", "rc"] }
tokio = { version = "1.36", features = ["full"] }

[features]
std-alloc = []
